<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scientific Calculator | Lekka Lab</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      overflow-y: auto;
    }

    .calculator {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 380px;
      padding: 16px;
      margin: auto;
    }

    .display-screen {
      background: #090d16;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 14px;
      text-align: right;
    }

    .expression {
      color: #94a3b8;
      font-size: 13px;
      min-height: 18px;
      word-break: break-all;
    }

    .result {
      color: #38bdf8;
      font-size: 26px;
      font-weight: 700;
      min-height: 32px;
      word-break: break-all;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }

    button {
      background: #334155;
      color: #f8fafc;
      border: none;
      border-radius: 6px;
      padding: 11px 0;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      transition: background 0.1s;
    }

    button:hover { background: #475569; }
    button:active { transform: scale(0.97); }

    .btn-func { background: #1e293b; border: 1px solid #475569; color: #93c5fd; }
    .btn-func:hover { background: #334155; }
    .btn-op { background: #0284c7; color: white; }
    .btn-op:hover { background: #0369a1; }
    .btn-action { background: #ef4444; color: white; }
    .btn-action:hover { background: #dc2626; }
    .btn-equal { background: #10b981; color: white; }
    .btn-equal:hover { background: #059669; }
  </style>
</head>
<body>

  <div class="calculator">
    <div class="display-screen">
      <div id="expression" class="expression"></div>
      <div id="result" class="result">0</div>
    </div>

    <div class="keypad">
      <!-- Row 1 -->
      <button class="btn-func" onclick="applyFunc('sin')">sin</button>
      <button class="btn-func" onclick="applyFunc('cos')">cos</button>
      <button class="btn-func" onclick="applyFunc('tan')">tan</button>
      <button class="btn-action" onclick="clearAll()">AC</button>
      <button class="btn-action" onclick="deleteChar()">DEL</button>

      <!-- Row 2 -->
      <button class="btn-func" onclick="applyFunc('ln')">ln</button>
      <button class="btn-func" onclick="applyFunc('log')">log</button>
      <button class="btn-func" onclick="insert('(')">(</button>
      <button class="btn-func" onclick="insert(')')">)</button>
      <button class="btn-op" onclick="insert('/')">÷</button>

      <!-- Row 3 -->
      <button class="btn-func" onclick="applyFunc('sqrt')">√</button>
      <button onclick="insert('7')">7</button>
      <button onclick="insert('8')">8</button>
      <button onclick="insert('9')">9</button>
      <button class="btn-op" onclick="insert('*')">×</button>

      <!-- Row 4 -->
      <button class="btn-func" onclick="insert('**2')">x²</button>
      <button onclick="insert('4')">4</button>
      <button onclick="insert('5')">5</button>
      <button onclick="insert('6')">6</button>
      <button class="btn-op" onclick="insert('-')">−</button>

      <!-- Row 5 -->
      <button class="btn-func" onclick="insert('**')">xʸ</button>
      <button onclick="insert('1')">1</button>
      <button onclick="insert('2')">2</button>
      <button onclick="insert('3')">3</button>
      <button class="btn-op" onclick="insert('+')">+</button>
