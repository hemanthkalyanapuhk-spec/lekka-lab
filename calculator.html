<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scientific Calculator | Lekka Lab</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .calculator {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 440px;
      padding: 20px;
    }

    /* Screen / Display */
    .display-screen {
      background: #090d16;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 80px;
      word-break: break-all;
    }

    .expression {
      color: #94a3b8;
      font-size: 14px;
      text-align: right;
      min-height: 18px;
    }

    .result {
      color: #38bdf8;
      font-size: 28px;
      font-weight: 700;
      text-align: right;
      letter-spacing: 0.5px;
    }

    /* Keypad Grid */
    .keypad {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    button {
      background: #334155;
      color: #f8fafc;
      border: none;
      border-radius: 8px;
      padding: 14px 0;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
    }

    button:hover {
      background: #475569;
    }

    button:active {
      transform: scale(0.96);
    }

    /* Color Categories */
    .btn-func {
      background: #1e293b;
      border: 1px solid #475569;
      color: #93c5fd;
    }
    .btn-func:hover {
      background: #334155;
    }

    .btn-op {
      background: #0284c7;
      color: #ffffff;
    }
    .btn-op:hover {
      background: #0369a1;
    }

    .btn-action {
      background: #ef4444;
      color: #ffffff;
    }
    .btn-action:hover {
      background: #dc2626;
    }

    .btn-equal {
      background: #10b981;
      color: #ffffff;
    }
    .btn-equal:hover {
      background: #059669;
    }
  </style>
</head>
<body>

  <div class="calculator">
    <div class="display-screen">
      <div id="expression" class="expression"></div>
      <div id="result" class="result">0</div>
    </div>

    <div class="keypad">
      <!-- Row 1 -->
      <button class="btn-func" onclick="applyFunc('sin')">sin</button>
      <button class="btn-func" onclick="applyFunc('cos')">cos</button>
      <button class="btn-func" onclick="applyFunc('tan')">tan</button>
      <button class="btn-action" onclick="clearAll()">AC</button>
      <button class="btn-action" onclick="deleteChar()">DEL</button>

      <!-- Row 2 -->
      <button class="btn-func" onclick="applyFunc('ln')">ln</button>
      <button class="btn-func" onclick="applyFunc('log')">log</button>
      <button class="btn-func" onclick="insert('(')">(</button>
      <button class="btn-func" onclick="insert(')')">)</button>
      <button class="btn-op" onclick="insert('/')">÷</button>

      <!-- Row 3 -->
      <button class="btn-func" onclick="applyFunc('sqrt')">√</button>
      <button onclick="insert('7')">7</button>
      <button onclick="insert('8')">8</button>
      <button onclick="insert('9')">9</button>
      <button class="btn-op" onclick="insert('*')">×</button>

      <!-- Row 4 -->
      <button class="btn-func" onclick="insert('**2')">x²</button>
      <button onclick="insert('4')">4</button>
      <button onclick="insert('5')">5</button>
      <button onclick="insert('6')">6</button>
      <button class="btn-op" onclick="insert('-')">−</button>
