<style>
:root {
  color-scheme: dark;
  --bg: #0b1020;
  --card: #141e33;
  --panel: #091426;
  --line: #2c3a55;
  --text: #edf3ff;
  --muted: #a9b8d1;
  --green: #6ee7c2;
  --blue: #8ab4ff;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.65 system-ui, sans-serif;
}
header {
  padding: 32px 18px;
  background: linear-gradient(120deg, #162a49, #125047);
  border-bottom: 1px solid var(--line);
}
main { max-width: 1250px; margin: auto; padding: 20px; }
h1 { font-size: clamp(30px, 5vw, 46px); margin: 0; line-height: 1.2; }
h2 { font-size: 20px; line-height: 1.4; margin: 8px 0; }
p { margin: 8px 0; }
.tag {
  font-size: 12px;
  text-transform: uppercase;
  color: var(--green);
  letter-spacing: .07em;
  font-weight: 700;
}
.muted { color: var(--muted); }
.controls {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 10px;
  margin: 22px 0 14px;
}
input, select, button { font: inherit; }
input, select {
  width: 100%;
  padding: 12px;
  border-radius: 9px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--text);
}
input:focus, select:focus, button:focus-visible {
  outline: 2px solid var(--green);
  outline-offset: 2px;
}
.topics {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 14px 0 20px;
}
button {
  cursor: pointer;
  background: var(--card);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 9px 13px;
}
button:hover { border-color: var(--green); }
button.active {
  background: var(--green);
  color: #06261e;
  border-color: var(--green);
}
.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.stat, .card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
}
.stat { padding: 14px; }
.stat strong {
  display: block;
  color: var(--green);
  font-size: 26px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 290px), 1fr));
  gap: 14px;
  margin-top: 16px;
}
.card {
  padding: 16px;
  min-width: 0;
  display: flex;
  flex-direction: column;
}
.card .math {
  padding: 16px 10px;
  background: var(--panel);
  border: 1px solid #1e3048;
  border-radius: 9px;
  margin: 13px 0;
  min-height: 76px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  overflow-x: auto;
  overflow-y: hidden;
  font-size: 19px;
}
.math mjx-container { max-width: 100%; }
.math mjx-container[display="true"] { margin: 0 !important; }
.details {
  margin-top: auto;
  border-top: 1px solid var(--line);
  padding-top: 12px;
}
summary { cursor: pointer; color: var(--green); }
.example { color: var(--muted); font-size: 14px; }
.actions { margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
.actions button { border-radius: 9px; font-size: 14px; }
.copy-status { color: var(--green); font-size: 13px; }
#empty {
  text-align: center;
  padding: 35px 15px;
  color: var(--muted);
}
footer { text-align: center; padding: 28px 16px; color: var(--muted); }
@media (max-width: 600px) {
  .controls, .stats { grid-template-columns: 1fr; }
  main { padding: 16px; }
  header { padding: 27px 12px; }
  .card .math { font-size: 17px; }
}
</style>

["Statistics","Probability complement","Formula",String.raw`P(A^c)=1-P(A)`,"Probability that event A does not occur.",String.raw`P(A)=0.3\Rightarrow P(A^c)=0.7`,"probability complement"],
["Statistics","Probability addition rule","Formula",String.raw`P(A\cup B)=P(A)+P(B)-P(A\cap B)`,"Subtract the overlap when calculating the probability of either event.",String.raw`P(A)=0.5,\ P(B)=0.4,\ P(A\cap B)=0.2\Rightarrow0.7`,"probability union"],
["Statistics","Conditional probability","Formula",String.raw`P(A\mid B)=\frac{P(A\cap B)}{P(B)}`,"Requires P(B) greater than zero.",String.raw`P(A\cap B)=0.2,\ P(B)=0.5\Rightarrow0.4`,"conditional probability"],
["Statistics","Independent events","Definition",String.raw`P(A\cap B)=P(A)P(B)`,"For independent events, the occurrence of one does not change the probability of the other.",String.raw`0.5(0.2)=0.1`,"independence"],
["Statistics","Bayes' theorem","Theorem",String.raw`P(A\mid B)=\frac{P(B\mid A)P(A)}{P(B)}`,"Requires P(B) greater than zero.",String.raw`P(A)=0.2,\ P(B\mid A)=0.8`,"Bayes posterior"],
["Statistics","Binomial probability","Formula",String.raw`P(X=k)=\binom nkp^k(1-p)^{n-k}`,"For n independent Bernoulli trials with success probability p.",String.raw`n=2,\ p=0.5,\ k=1\Rightarrow P(X=1)=0.5`,"binomial distribution"],
["Statistics","Binomial mean","Formula",String.raw`E(X)=np`,"Expected number of successes in a binomial distribution.",String.raw`n=10,\ p=0.3\Rightarrow E(X)=3`,"binomial expectation"],
["Statistics","Binomial variance","Formula",String.raw`\operatorname{Var}(X)=np(1-p)`,"Variance of a binomial random variable.",String.raw`n=10,\ p=0.3\Rightarrow2.1`,"binomial variance"],
["Statistics","Expected value","Formula",String.raw`E(X)=\sum_x xP(X=x)`,"Probability-weighted average of discrete outcomes.",String.raw`\text{Fair die: }E(X)=3.5`,"expectation"],
["Statistics","Variance from moments","Formula",String.raw`\operatorname{Var}(X)=E(X^2)-[E(X)]^2`,"Equivalent expression for variance when the moments exist.",String.raw`E(X^2)=10,\ E(X)=2\Rightarrow\operatorname{Var}(X)=6`,"moments"],
["Statistics","Covariance","Formula",String.raw`\operatorname{Cov}(X,Y)=E[(X-\mu_X)(Y-\mu_Y)]`,"Measures how two variables vary together.",String.raw`\operatorname{Cov}(X,Y)>0\text{ indicates positive linear co-variation}`,"covariance"],
["Statistics","Pearson correlation","Formula",String.raw`r=\frac{\operatorname{Cov}(X,Y)}{\sigma_X\sigma_Y}`,"Defined when both standard deviations are positive; r lies between -1 and 1.",String.raw`r=1\text{ indicates perfect positive linear correlation}`,"correlation Pearson"],
["Statistics","Standard error of mean","Formula",String.raw`SE(\bar{x})=\frac{s}{\sqrt n}`,"Estimated standard deviation of the sample mean.",String.raw`s=10,\ n=100\Rightarrow SE=1`,"standard error"],
["Statistics","Normal distribution density","Formula",String.raw`f(x)=\frac1{\sigma\sqrt{2\pi}}e^{-\frac12((x-\mu)/\sigma)^2}`,"Density of a normal distribution with mean mu and positive standard deviation sigma.",String.raw`\mu=0,\ \sigma=1\text{ gives the standard normal density}`,"normal Gaussian"],
["Statistics","Coefficient of variation","Formula",String.raw`CV=\frac{\sigma}{\mu}\times100\%`,"Relative dispersion when the mean is meaningful and nonzero.",String.raw`\sigma=5,\ \mu=20\Rightarrow CV=25\%`,"relative variability"],
["Statistics","Poisson probability","Formula",String.raw`P(X=k)=\frac{\lambda^ke^{-\lambda}}{k!}`,"For a Poisson random variable with rate lambda and k a nonnegative integer.",String.raw`\lambda=2,\ k=0\Rightarrow P(X=0)=e^{-2}`,"Poisson"],
["Statistics","Poisson mean and variance","Formula",String.raw`E(X)=\operatorname{Var}(X)=\lambda`,"Both mean and variance equal the Poisson rate.",String.raw`\lambda=4\Rightarrow E(X)=4,\ \operatorname{Var}(X)=4`,"Poisson rate"],

/* ===================== COORDINATE GEOMETRY ===================== */
["Coordinate Geometry","Distance between two points","Formula",String.raw`d=\sqrt{(x_2-x_1)^2+(y_2-y_1)^2}`,"Euclidean distance between two Cartesian points.",String.raw`(0,0),(3,4)\Rightarrow d=5`,"distance"],
["Coordinate Geometry","Midpoint","Formula",String.raw`M=\left(\frac{x_1+x_2}{2},\frac{y_1+y_2}{2}\right)`,"Average corresponding coordinates.",String.raw`(0,2),(4,6)\Rightarrow M=(2,4)`,"midpoint"],
["Coordinate Geometry","Slope","Formula",String.raw`m=\frac{y_2-y_1}{x_2-x_1}`,"Requires different x-coordinates.",String.raw`(1,2),(3,6)\Rightarrow m=2`,"gradient slope"],
["Coordinate Geometry","Point-slope line equation","Formula",String.raw`y-y_1=m(x-x_1)`,"Line with slope m passing through a known point.",String.raw`(1,2),\ m=3\Rightarrow y-2=3(x-1)`,"straight line"],
["Coordinate Geometry","Slope-intercept line equation","Formula",String.raw`y=mx+c`,"m is the slope and c is the vertical intercept.",String.raw`y=2x+1`,"line intercept"],
["Coordinate Geometry","General line equation","Formula",String.raw`Ax+By+C=0`,"General equation of a straight line.",String.raw`2x+3y-6=0`,"line"],
["Coordinate Geometry","Intercept form","Formula",String.raw`\frac xa+\frac yb=1`,"Line with nonzero x- and y-intercepts a and b.",String.raw`\frac x4+\frac y2=1`,"intercepts"],
["Coordinate Geometry","Parallel lines","Theorem",String.raw`m_1=m_2`,"Distinct nonvertical parallel lines have equal slopes.",String.raw`m_1=m_2=2`,"parallel"],
["Coordinate Geometry","Perpendicular lines","Theorem",String.raw`m_1m_2=-1`,"For nonvertical perpendicular lines with defined slopes.",String.raw`m_1=2,\ m_2=-\frac12`,"perpendicular"],
["Coordinate Geometry","Triangle area from coordinates","Formula",String.raw`A=\frac12\left|x_1(y_2-y_3)+x_2(y_3-y_1)+x_3(y_1-y_2)\right|`,"Area determined by three vertices.",String.raw`(0,0),(4,0),(0,3)\Rightarrow A=6`,"coordinate triangle"],
["Coordinate Geometry","Circle equation","Formula",String.raw`(x-h)^2+(y-k)^2=r^2`,"Circle centered at (h,k) with radius r.",String.raw`x^2+y^2=25\Rightarrow r=5`,"circle equation"],
["Coordinate Geometry","Circle equation at origin","Formula",String.raw`x^2+y^2=r^2`,"Circle centered at the origin.",String.raw`x^2+y^2=9\Rightarrow r=3`,"circle origin"],
["Coordinate Geometry","Parabola opening right","Formula",String.raw`y^2=4ax`,"Parabola with vertex at the origin and focus at (a,0).",String.raw`y^2=8x\Rightarrow\text{focus }(2,0)`,"parabola focus"],
["Coordinate Geometry","Parabola opening upward","Formula",String.raw`x^2=4ay`,"Parabola with vertex at the origin and focus at (0,a).",String.raw`x^2=12y\Rightarrow\text{focus }(0,3)`,"parabola"],
["Coordinate Geometry","Ellipse","Formula",String.raw`\frac{x^2}{a^2}+\frac{y^2}{b^2}=1`,"Ellipse centered at the origin with positive semiaxes a and b.",String.raw`\frac{x^2}{25}+\frac{y^2}{9}=1`,"ellipse"],
["Coordinate Geometry","Horizontal hyperbola","Formula",String.raw`\frac{x^2}{a^2}-\frac{y^2}{b^2}=1`,"Horizontal hyperbola centered at the origin.",String.raw`\frac{x^2}{9}-\frac{y^2}{4}=1`,"hyperbola"],
["Coordinate Geometry","Section formula","Formula",String.raw`P=\left(\frac{mx_2+nx_1}{m+n},\frac{my_2+ny_1}{m+n}\right)`,"Internal division of a segment in ratio m:n.",String.raw`m=n\Rightarrow\text{midpoint}`,"section ratio"],
["Coordinate Geometry","Centroid of triangle","Formula",String.raw`G=\left(\frac{x_1+x_2+x_3}{3},\frac{y_1+y_2+y_3}{3}\right)`,"Intersection of the medians of a triangle.",String.raw`(0,0),(3,0),(0,3)\Rightarrow G=(1,1)`,"centroid"],
["Coordinate Geometry","Point-to-line distance","Formula",String.raw`d=\frac{|Ax_0+By_0+C|}{\sqrt{A^2+B^2}}`,"Distance from point (x0,y0) to line Ax+By+C=0.",String.raw`(0,0),\ 3x+4y-10=0\Rightarrow d=2`,"line distance"],
["Coordinate Geometry","Origin distance","Formula",String.raw`d=\sqrt{x^2+y^2}`,"Distance from the origin to a point.",String.raw`(3,4)\Rightarrow d=5`,"origin distance"],

/* ===================== TRIGONOMETRY ===================== */
["Trigonometry","Sine ratio","Definition",String.raw`\sin\theta=\frac{\text{opposite}}{\text{hypotenuse}}`,"Right-triangle sine ratio.",String.raw`\frac35\text{ for opposite }3\text{ and hypotenuse }5`,"sine"],
["Trigonometry","Cosine ratio","Definition",String.raw`\cos\theta=\frac{\text{adjacent}}{\text{hypotenuse}}`,"Right-triangle cosine ratio.",String.raw`\frac45\text{ for adjacent }4\text{ and hypotenuse }5`,"cosine"],
["Trigonometry","Tangent ratio","Definition",String.raw`\tan\theta=\frac{\text{opposite}}{\text{adjacent}}`,"Right-triangle tangent ratio.",String.raw`\frac34\text{ for opposite }3\text{ and adjacent }4`,"tangent"],
["Trigonometry","Reciprocal cosecant","Identity",String.raw`\csc\theta=\frac1{\sin\theta}`,"Defined where sine is nonzero.",String.raw`\sin30^\circ=\frac12\Rightarrow\csc30^\circ=2`,"cosecant"],
["Trigonometry","Reciprocal secant","Identity",String.raw`\sec\theta=\frac1{\cos\theta}`,"Defined where cosine is nonzero.",String.raw`\cos60^\circ=\frac12\Rightarrow\sec60^\circ=2`,"secant"],
["Trigonometry","Cotangent","Identity",String.raw`\cot\theta=\frac{\cos\theta}{\sin\theta}`,"Defined where sine is nonzero.",String.raw`\cot45^\circ=1`,"cotangent"],
["Trigonometry","Pythagorean identity","Identity",String.raw`\sin^2x+\cos^2x=1`,"Fundamental trigonometric identity.",String.raw`\sin x=\frac35\Rightarrow\cos^2x=\frac{16}{25}`,"identity"],
["Trigonometry","Tangent identity","Identity",String.raw`1+\tan^2x=\sec^2x`,"Valid where tangent and secant are defined.",String.raw`\tan x=2\Rightarrow\sec^2x=5`,"identity"],
["Trigonometry","Cotangent identity","Identity",String.raw`1+\cot^2x=\csc^2x`,"Valid where cotangent and cosecant are defined.",String.raw`\cot x=2\Rightarrow\csc^2x=5`,"identity"],
["Trigonometry","Tangent quotient","Identity",String.raw`\tan x=\frac{\sin x}{\cos x}`,"Requires cosine to be nonzero.",String.raw`\tan45^\circ=1`,"quotient"],
["Trigonometry","Sine of a sum","Identity",String.raw`\sin(A+B)=\sin A\cos B+\cos A\sin B`,"Compound-angle identity.",String.raw`\sin(30^\circ+60^\circ)=1`,"compound angle"],
["Trigonometry","Sine of a difference","Identity",String.raw`\sin(A-B)=\sin A\cos B-\cos A\sin B`,"Compound-angle identity.",String.raw`\sin(45^\circ-45^\circ)=0`,"compound angle"],
["Trigonometry","Cosine of a sum","Identity",String.raw`\cos(A+B)=\cos A\cos B-\sin A\sin B`,"Compound-angle identity.",String.raw`\cos(45^\circ+45^\circ)=0`,"compound angle"],
["Trigonometry","Cosine of a difference","Identity",String.raw`\cos(A-B)=\cos A\cos B+\sin A\sin B`,"Compound-angle identity.",String.raw`\cos(60^\circ-60^\circ)=1`,"compound angle"],
["Trigonometry","Tangent of a sum","Identity",String.raw`\tan(A+B)=\frac{\tan A+\tan B}{1-\tan A\tan B}`,"Valid where all expressions are defined.",String.raw`\tan(45^\circ+45^\circ)\text{ is undefined}`,"tangent sum"],
["Trigonometry","Sine double angle","Identity",String.raw`\sin2x=2\sin x\cos x`,"Double-angle identity.",String.raw`x=45^\circ\Rightarrow\sin2x=1`,"double angle"],
["Trigonometry","Cosine double angle","Identity",String.raw`\cos2x=\cos^2x-\sin^2x`,"Equivalent forms are 2 cos squared x minus 1 and 1 minus 2 sin squared x.",String.raw`x=60^\circ\Rightarrow\cos2x=-\frac12`,"double angle"],
["Trigonometry","Tangent double angle","Identity",String.raw`\tan2x=\frac{2\tan x}{1-\tan^2x}`,"Valid when the expression is defined.",String.raw`\tan30^\circ=\frac1{\sqrt3}\Rightarrow\tan60^\circ=\sqrt3`,"double angle"],
["Trigonometry","Half-angle cosine","Identity",String.raw`\cos^2\frac x2=\frac{1+\cos x}{2}`,"Half-angle identity.",String.raw`x=60^\circ\Rightarrow\cos^2 30^\circ=\frac34`,"half angle"],
["Trigonometry","Sine rule","Formula",String.raw`\frac a{\sin A}=\frac b{\sin B}=\frac c{\sin C}`,"Each triangle side divided by its opposite-angle sine gives the same ratio.",String.raw`a=5,\ A=30^\circ\Rightarrow\frac a{\sin A}=10`,"sine rule triangle"],
["Trigonometry","Cosine rule","Formula",String.raw`c^2=a^2+b^2-2ab\cos C`,"Find a side using two sides and the included angle.",String.raw`a=b=5,\ C=60^\circ\Rightarrow c=5`,"cosine rule"],
["Trigonometry","Triangle area using sine","Formula",String.raw`A=\frac12 ab\sin C`,"Two sides and their included angle determine area.",String.raw`a=4,\ b=6,\ C=30^\circ\Rightarrow A=6`,"triangle area"],
["Trigonometry","Degree-radian conversion","Formula",String.raw`\text{radians}=\text{degrees}\frac{\pi}{180^\circ}`,"Converts degrees into radians.",String.raw`90^\circ=\frac\pi2`,"radians degrees"],
["Trigonometry","Unit circle","Definition",String.raw`x=\cos\theta,\quad y=\sin\theta,\quad x^2+y^2=1`,"A point on the unit circle has coordinates cosine and sine of the angle.",String.raw`\theta=0\Rightarrow(x,y)=(1,0)`,"unit circle"],
["Trigonometry","Sine periodicity","Identity",String.raw`\sin(x+2\pi)=\sin x`,"Sine has period 2 pi radians.",String.raw`\sin(2\pi+x)=\sin x`,"period"],
["Trigonometry","Cosine periodicity","Identity",String.raw`\cos(x+2\pi)=\cos x`,"Cosine has period 2 pi radians.",String.raw`\cos(2\pi+x)=\cos x`,"period"],
["Trigonometry","Sine law of complementary angles","Identity",String.raw`\sin\left(\frac\pi2-x\right)=\cos x`,"Cofunction identity for angles in radians.",String.raw`\sin30^\circ=\cos60^\circ`,"complementary"],

/* ===================== CALCULUS ===================== */
["Calculus","Derivative from first principles","Definition",String.raw`f'(x)=\lim_{h\to0}\frac{f(x+h)-f(x)}h`,"Defines the derivative where the limit exists.",String.raw`f(x)=x^2\Rightarrow f'(x)=2x`,"limit derivative"],
["Calculus","Power rule","Formula",String.raw`\frac{d}{dx}x^n=nx^{n-1}`,"For real powers on suitable domains where the function is differentiable.",String.raw`\frac{d}{dx}x^3=3x^2`,"derivative power"],
["Calculus","Constant derivative","Formula",String.raw`\frac{d}{dx}c=0`,"The derivative of a constant is zero.",String.raw`\frac{d}{dx}7=0`,"derivative constant"],
["Calculus","Constant multiple rule","Formula",String.raw`\frac{d}{dx}[cf(x)]=cf'(x)`,"A constant factor remains unchanged.",String.raw`\frac{d}{dx}(3x^2)=6x`,"derivative"],
["Calculus","Sum rule","Formula",String.raw`(f+g)'=f'+g'`,"Differentiate each summand.",String.raw`\frac{d}{dx}(x^2+\sin x)=2x+\cos x`,"derivative sum"],
["Calculus","Product rule","Formula",String.raw`(fg)'=f'g+fg'`,"Derivative of a product of differentiable functions.",String.raw`\frac{d}{dx}(x\sin x)=\sin x+x\cos x`,"product derivative"],
["Calculus","Quotient rule","Formula",String.raw`\left(\frac fg\right)'=\frac{f'g-fg'}{g^2}`,"Requires g to be nonzero in the domain considered.",String.raw`\frac{d}{dx}\frac{x}{x+1}=\frac1{(x+1)^2}`,"quotient derivative"],
["Calculus","Chain rule","Formula",String.raw`\frac{d}{dx}f(g(x))=f'(g(x))g'(x)`,"Differentiate the outer function, then multiply by the inner derivative.",String.raw`\frac{d}{dx}\sin(x^2)=2x\cos(x^2)`,"chain derivative"],
["Calculus","Exponential derivative","Formula",String.raw`\frac{d}{dx}e^x=e^x`,"The natural exponential function is its own derivative.",String.raw`\frac{d}{dx}e^{3x}=3e^{3x}`,"exponential derivative"],
["Calculus","General exponential derivative","Formula",String.raw`\frac{d}{dx}a^x=a^x\ln a`,"For a positive constant a.",String.raw`\frac{d}{dx}2^x=2^x\ln2`,"exponential"],
["Calculus","Natural logarithm derivative","Formula",String.raw`\frac{d}{dx}\ln x=\frac1x`,"Valid for x greater than zero.",String.raw`\frac{d}{dx}\ln(3x)=\frac1x`,"log derivative"],
["Calculus","Sine derivative","Formula",String.raw`\frac{d}{dx}\sin x=\cos x`,"Angles are measured in radians.",String.raw`\frac{d}{dx}(3\sin x)=3\cos x`,"trigonometric derivative"],
["Calculus","Cosine derivative","Formula",String.raw`\frac{d}{dx}\cos x=-\sin x`,"Angles are measured in radians.",String.raw`\frac{d}{dx}\cos(2x)=-2\sin(2x)`,"trigonometric derivative"],
["Calculus","Tangent derivative","Formula",String.raw`\frac{d}{dx}\tan x=\sec^2x`,"Valid where tangent is defined.",String.raw`\frac{d}{dx}\tan(3x)=3\sec^2(3x)`,"tangent derivative"],
["Calculus","Implicit differentiation","Formula",String.raw`\frac{dy}{dx}=-\frac{F_x}{F_y}`,"For F(x,y)=0 where F is differentiable and F_y is nonzero.",String.raw`x^2+y^2=r^2\Rightarrow\frac{dy}{dx}=-\frac xy`,"implicit"],
["Calculus","Second derivative","Definition",String.raw`f''(x)=\frac{d^2f}{dx^2}`,"Derivative of the first derivative; often describes curvature.",String.raw`f(x)=x^3\Rightarrow f''(x)=6x`,"second derivative"],
["Calculus","Critical point condition","Definition",String.raw`f'(x)=0\quad\text{or }f'(x)\text{ is undefined}`,"Interior critical points occur where the derivative is zero or does not exist.",String.raw`f(x)=x^2\Rightarrow x=0`,"critical point"],
["Calculus","Power integral","Formula",String.raw`\int x^n\,dx=\frac{x^{n+1}}{n+1}+C,\quad n\ne-1`,"Antiderivative power rule.",String.raw`\int x^2\,dx=\frac{x^3}{3}+C`,"integration power"],
["Calculus","Integral of reciprocal","Formula",String.raw`\int\frac1x\,dx=\ln|x|+C`,"Valid on intervals that do not cross zero.",String.raw`\int\frac2x\,dx=2\ln|x|+C`,"logarithmic integral"],
["Calculus","Exponential integral","Formula",String.raw`\int e^x\,dx=e^x+C`,"Antiderivative of the natural exponential.",String.raw`\int3e^x\,dx=3e^x+C`,"exponential integral"],
["Calculus","Exponential base integral","Formula",String.raw`\int a^x\,dx=\frac{a^x}{\ln a}+C`,"For a positive base a not equal to one.",String.raw`\int2^x\,dx=\frac{2^x}{\ln2}+C`,"exponential"],
["Calculus","Sine integral","Formula",String.raw`\int\sin x\,dx=-\cos x+C`,"Angles are measured in radians.",String.raw`\int2\sin x\,dx=-2\cos x+C`,"sine integral"],
["Calculus","Cosine integral","Formula",String.raw`\int\cos x\,dx=\sin x+C`,"Angles are measured in radians.",String.raw`\int3\cos x\,dx=3\sin x+C`,"cosine integral"],
["Calculus","Integration by parts","Formula",String.raw`\int u\,dv=uv-\int v\,du`,"Choose u and dv so the resulting integral is simpler.",String.raw`\int xe^x\,dx=xe^x-e^x+C`,"integration by parts"],
["Calculus","Substitution rule","Formula",String.raw`\int f(g(x))g'(x)\,dx=\int f(u)\,du`,"Use u=g(x) to simplify a composite integrand.",String.raw`\int2x\cos(x^2)\,dx=\sin(x^2)+C`,"u substitution"],
["Calculus","Fundamental theorem of calculus","Theorem",String.raw`\frac{d}{dx}\int_a^x f(t)\,dt=f(x)`,"If f is continuous, differentiation recovers the integrand.",String.raw`\frac{d}{dx}\int_0^x t^2\,dt=x^2`,"FTC"],
["Calculus","Definite integral evaluation","Formula",String.raw`\int_a^b f(x)\,dx=F(b)-F(a)`,"F is an antiderivative of f on the interval.",String.raw`\int_0^1 2x\,dx=1`,"definite integral"],
["Calculus","Average value of a function","Formula",String.raw`f_{\mathrm{avg}}=\frac1{b-a}\int_a^b f(x)\,dx`,"Average value of a continuous function on a finite interval with a less than b.",String.raw`f(x)=x,\ [0,2]\Rightarrow f_{\mathrm{avg}}=1`,"average value"],
["Calculus","Arc length","Formula",String.raw`L=\int_a^b\sqrt{1+[f'(x)]^2}\,dx`,"Length of a differentiable curve y=f(x) on the interval.",String.raw`f(x)=0\text{ on }[0,3]\Rightarrow L=3`,"arc length"],
["Calculus","Taylor series","Formula",String.raw`f(x)=\sum_{n=0}^{\infty}\frac{f^{(n)}(a)}{n!}(x-a)^n`,"When the Taylor series converges to the function, it represents the function near a.",String.raw`e^x=\sum_{n=0}^{\infty}\frac{x^n}{n!}`,"Taylor expansion"],
["Calculus","Maclaurin series for sine","Formula",String.raw`\sin x=\sum_{n=0}^{\infty}\frac{(-1)^nx^{2n+1}}{(2n+1)!}`,"Taylor series for sine centered at zero.",String.raw`\sin x=x-\frac{x^3}{3!}+\frac{x^5}{5!}-\cdots`,"series sine"],
["Calculus","Maclaurin series for cosine","Formula",String.raw`\cos x=\sum_{n=0}^{\infty}\frac{(-1)^nx^{2n}}{(2n)!}`,"Taylor series for cosine centered at zero.",String.raw`\cos x=1-\frac{x^2}{2!}+\frac{x^4}{4!}-\cdots`,"series cosine"],
["Calculus","L'Hopital's rule","Theorem",String.raw`\lim_{x\to a}\frac{f(x)}{g(x)}=\lim_{x\to a}\frac{f'(x)}{g'(x)}`,"Applies to suitable indeterminate forms such as 0/0 or infinity/infinity when its conditions hold.",String.raw`\lim_{x\to0}\frac{\sin x}{x}=1`,"limits LHopital"],
["Calculus","Derivative of inverse function","Formula",String.raw`(f^{-1})'(y)=\frac1{f'(x)},\quad y=f(x)`,"Requires an invertible differentiable function and a nonzero derivative at the relevant point.",String.raw`f(x)=2x\Rightarrow(f^{-1})'(y)=\frac12`,"inverse derivative"],
["Calculus","Newton's method","Formula",String.raw`x_{n+1}=x_n-\frac{f(x_n)}{f'(x_n)}`,"Iterative numerical method for approximating a root.",String.raw`f(x)=x^2-2\text{ approximates }\sqrt2`,"numerical root"],

/* ===================== ADDITIONAL IMPORTANT FORMULAS ===================== */
["Algebra","Arithmetic mean-geometric mean inequality","Theorem",String.raw`\frac{a+b}{2}\ge\sqrt{ab},\quad a,b\ge0`,"The arithmetic mean of two nonnegative numbers is at least their geometric mean.",String.raw`a=4,\ b=9\Rightarrow6.5\ge6`,"AM GM inequality"],
["Algebra","Cauchy-Schwarz inequality","Theorem",String.raw`|\mathbf a\cdot\mathbf b|\le\|\mathbf a\|\|\mathbf b\|`,"The absolute dot product is no greater than the product of vector magnitudes.",String.raw`|(1,2)\cdot(3,4)|=11\le\sqrt5\sqrt{25}`,"inequality vectors"],
["Coordinate Geometry","Vector magnitude","Formula",String.raw`\|\mathbf v\|=\sqrt{v_1^2+v_2^2+v_3^2}`,"Euclidean length of a three-dimensional vector.",String.raw`\mathbf v=(2,3,6)\Rightarrow\|\mathbf v\|=7`,"vector magnitude"],
["Coordinate Geometry","Dot product","Formula",String.raw`\mathbf a\cdot\mathbf b=\sum_{i=1}^{n}a_ib_i`,"The dot product is the sum of products of corresponding components.",String.raw`(1,2)\cdot(3,4)=11`,"vector dot product"],
["Coordinate Geometry","Angle between vectors","Formula",String.raw`\cos\theta=\frac{\mathbf a\cdot\mathbf b}{\|\mathbf a\|\|\mathbf b\|}`,"For nonzero vectors, determines their included angle.",String.raw`\mathbf a\cdot\mathbf b=0\Rightarrow\theta=90^\circ`,"vector angle"],
["Statistics","Chebyshev's inequality","Theorem",String.raw`P(|X-\mu|\ge k\sigma)\le\frac1{k^2}`,"For a random variable with finite mean and finite positive variance, k is positive.",String.raw`k=2\Rightarrow P(|X-\mu|\ge2\sigma)\le\frac14`,"probability inequality"],
["Statistics","Law of total probability","Theorem",String.raw`P(B)=\sum_iP(B\mid A_i)P(A_i)`,"For a partition of the sample space into mutually exclusive events A_i with appropriate conditional probabilities.",String.raw`P(B)=P(B\mid A)P(A)+P(B\mid A^c)P(A^c)`,"total probability"],
["Calculus","Gradient of a function","Formula",String.raw`\nabla f=\left(\frac{\partial f}{\partial x_1},\ldots,\frac{\partial f}{\partial x_n}\right)`,"The gradient collects the first partial derivatives.",String.raw`f(x,y)=x^2+y^2\Rightarrow\nabla f=(2x,2y)`,"multivariable gradient"],
["Calculus","Partial derivative","Definition",String.raw`\frac{\partial f}{\partial x}`,"Differentiate with respect to x while holding the other independent variables fixed.",String.raw`f(x,y)=x^2y\Rightarrow\frac{\partial f}{\partial x}=2xy`,"partial derivative"],
["Calculus","Double integral","Formula",String.raw`\iint_R f(x,y)\,dA`,"Integral over a two-dimensional region R.",String.raw`\iint_R1\,dA=\text{area}(R)`,"double integral"],
["Calculus","Integration in polar coordinates","Formula",String.raw`dA=r\,dr\,d\theta`,"Area element in polar coordinates.",String.raw`\iint_R f(x,y)\,dA=\iint f(r\cos\theta,r\sin\theta)r\,dr\,d\theta`,"polar integration"]
];

/* ===================== APPLICATION ===================== */

const subjects = [
  "Number Theory",
  "Geometry",
  "Algebra",
  "Statistics",
  "Coordinate Geometry",
  "Trigonometry",
  "Calculus"
];

const library = data.map((row, index) => ({
  id: index + 1,
  topic: row[0],
  title: row[1],
  type: row[2],
  formula: row[3],
  explanation: row[4],
  example: row[5],
  keywords: row[6] || ""
}));

const state = {
  topic: "All",
  query: "",
  kind: ""
};

const $ = id => document.getElementById(id);

function makeElement(tag, text, className) {
  const element = document.createElement(tag);
  if (text !== undefined) element.textContent = text;
  if (className) element.className = className;
  return element;
}

function renderTopics() {
  const nav = $("topics");
  nav.replaceChildren();

  ["All", ...subjects].forEach(topic => {
    const button = makeElement(
      "button",
      topic,
      state.topic === topic ? "active" : ""
    );

    button.type = "button";
    button.setAttribute("aria-pressed", String(state.topic === topic));

    button.addEventListener("click", () => {
      state.topic = topic;
      renderTopics();
      render();
    });

    nav.appendChild(button);
  });
}

function matches(entry, query) {
  const searchable = [
    entry.topic,
    entry.title,
    entry.type,
    entry.formula,
    entry.explanation,
    entry.example,
    entry.keywords
  ].join(" ").toLowerCase();

  return !query || searchable.includes(query);
}

function render() {
  const query = state.query.trim().toLowerCase();

  const filtered = library.filter(entry => {
    return (
      (state.topic === "All" || entry.topic === state.topic) &&
      (!state.kind || entry.type === state.kind) &&
      matches(entry, query)
    );
  });

  $("total").textContent = library.length.toLocaleString();
  $("shown").textContent = filtered.length.toLocaleString();
  $("subjectCount").textContent = subjects.length;

  $("empty").hidden = filtered.length !== 0;

  const root = $("results");
  root.replaceChildren();

  const fragment = document.createDocumentFragment();

  filtered.forEach(entry => {
    const card = makeElement("article", undefined, "card");

    card.appendChild(makeElement("div", entry.topic, "tag"));
    card.appendChild(makeElement("h2", entry.title));
    card.appendChild(makeElement("div", entry.type, "muted"));

    const math = makeElement("div", undefined, "math");
    math.setAttribute("aria-label", "Mathematical formula");

    // Explicit MathJax delimiters are essential.
    math.textContent = "\\[" + entry.formula + "\\]";
    card.appendChild(math);

    const details = makeElement("details", undefined, "details");
    const summary = makeElement("summary", "Explanation and worked example");
    const explanation = makeElement("p", entry.explanation);
    const example = makeElement("p", "Example: " + entry.example, "example");

    details.appendChild(summary);
    details.appendChild(explanation);
    details.appendChild(example);
    card.appendChild(details);

    const actions = makeElement("div", undefined, "actions");
    const copyButton = makeElement("button", "Copy LaTeX");
    copyButton.type = "button";

    const copyStatus = makeElement("span", "", "copy-status");
    copyStatus.setAttribute("role", "status");

    copyButton.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(entry.formula);
        copyStatus.textContent = "Formula copied";
        copyButton.textContent = "Copied!";
      } catch {
        // Fallback for browsers without clipboard permission.
        const textarea = makeElement("textarea");
        textarea.value = entry.formula;
        textarea.setAttribute("aria-label", "Formula to copy");
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.select();

        let copied = false;
        try {
          copied = document.execCommand("copy");
        } catch {
          copied = false;
        }

        textarea.remove();

        copyStatus.textContent = copied
          ? "Formula copied"
          : "Copy unavailable; select the formula from the source";
        copyButton.textContent = copied ? "Copied!" : "Copy failed";
      }
    });

    actions.appendChild(copyButton);
    actions.appendChild(copyStatus);
    card.appendChild(actions);

    fragment.appendChild(card);
  });

  root.appendChild(fragment);

  $("status").textContent =
    "Showing " + filtered.length.toLocaleString() +
    " of " + library.length.toLocaleString() +
    " formulas" +
    (state.topic === "All" ? "" : " · " + state.topic) +
    (state.kind ? " · " + state.kind : "");

  typesetMath(root);
}

let typesetTimer = null;

async function typesetMath(root) {
  // MathJax loads asynchronously. If it is not ready yet,
  // retry once its startup promise has settled.
  if (!window.MathJax || !window.MathJax.typesetPromise) {
    if (window.MathJax && window.MathJax.startup &&
        window.MathJax.startup.promise) {
      try {
        await window.MathJax.startup.promise;
      } catch (error) {
        console.error("MathJax initialization failed:", error);
      }
    }
  }

  if (!window.MathJax || !window.MathJax.typesetPromise) {
    clearTimeout(typesetTimer);
    typesetTimer = setTimeout(() => typesetMath(root), 300);
    return;
  }

  try {
    // Clear any old MathJax output before typesetting again.
    if (window.MathJax.typesetClear) {
      window.MathJax.typesetClear([root]);
    }
    await window.MathJax.typesetPromise([root]);
  } catch (error) {
    console.error("Formula rendering failed:", error);
  }
}

$("search").addEventListener("input", event => {
  state.query = event.target.value;
  render();
});

$("kind").addEventListener("change", event => {
  state.kind = event.target.value;
  render();
});

renderTopics();
render();
</script>
</body>
</html>
