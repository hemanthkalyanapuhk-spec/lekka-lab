<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lekka Lab: Mathematics Textbooks</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #f8fafc;
      color: #0f172a;
      padding-bottom: 60px;
    }

    header {
      background: linear-gradient(135deg, #1e3a8a, #0284c7);
      color: white;
      padding: 26px 16px;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.08);
    }

    header h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .container {
      max-width: 750px;
      margin: 24px auto;
      padding: 0 16px;
    }

    input[type="radio"].tab-toggle {
      display: none;
    }

      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

      flex: 1;
      text-align: center;
      padding: 14px 18px;
