<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lekka Lab | School Learning Hub</title>
<style>
:root{--primary:#1746a2;--primary-light:#2563eb;--bg:#f4f7fc;--card:#ffffff;--border:#cbd5e1;--text:#0f172a}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{background:var(--bg);color:var(--text);padding-bottom:50px}

/* Header */
header{background:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.brand{font-size:22px;font-weight:700;color:var(--primary);cursor:pointer}
nav{display:flex;gap:8px}
nav button{border:0;border-radius:8px;padding:8px 14px;background:#eaf0ff;color:var(--primary);font-weight:600;font-size:13px;cursor:pointer}

main{max-width:900px;margin:16px auto;padding:0 14px}

/* Hero */
.hero{background:linear-gradient(135deg,#12377f,#2563eb);color:#fff;border-radius:14px;padding:22px 18px;margin-bottom:18px}
.hero h1{font-size:24px;margin-bottom:6px}
.hero p{font-size:14px;opacity:0.95;line-height:1.5}

/* Filter Controls */
.filter-box{background:#fff;padding:16px;border-radius:12px;border:1px solid var(--border);margin-bottom:18px}
.filter-title{font-size:12px;font-weight:700;color:var(--primary);text-transform:uppercase;margin-bottom:8px}
.filter-group{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filter-group:last-child{margin-bottom:0}
.pill{padding:7px 14px;border-radius:20px;border:1px solid var(--border);background:#fff;font-weight:600;font-size:13px;color:#475569;cursor:pointer}
.pill.active{background:var(--primary);color:#fff;border-color:var(--primary)}

/* Subject Grid */
.section-title{font-size:18px;font-weight:700;color:var(--primary);margin:18px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px;cursor:pointer;text-align:center;transition:0.2s}
.card:hover{transform:translateY(-2px);border-color:var(--primary)}
.card span{font-size:26px;display:block;margin-bottom:4px}
.card strong{font-size:14px;display:block}
.card p{font-size:12px;color:#64748b;margin-top:4px}

/* Chapter Detail Box */
.content-box{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px;margin-top:16px}
.breadcrumb{font-size:13px;color:#64748b;margin-bottom:14px}
.breadcrumb b{color:var(--primary)}
.sec-h{color:var(--primary);font-size:16px;font-weight:700;margin:18px 0 8px;border-bottom:1px solid var(--border);padding-bottom:4px}
.info-box{background:#f8fafc;border-left:4px solid var(--primary);padding:12px;border-radius:6px;font-size:14px;line-height:1.6;margin-bottom:10px}
.formula-tag{background:#eef4ff;padding:8px 12px;border-radius:6px;font-family:monospace;font-size:14px;font-weight:700;color:#1e3a8a;border:1px solid #bfdbfe;margin-top:6px}

/* Exercise QA */
.qa-card{background:#fff;border:1px solid var(--border);border-radius:8px;padding:12px;margin-top:10px;font-size:14px}
.qa-card b{color:#0f172a}
.toggle-btn{display:inline-block;margin-top:8px;padding:5px 10px;font-size:12px;font-weight:600;background:#e2e8f0;border-radius:4px;cursor:pointer;color:#334155}
.solution{display:none;background:#f8fafc;padding:10px;border-radius:6px;margin-top:8px;border-top:1px dashed var(--border);font-size:13px;line-height:1.6}

/* Utility */
.hidden{display:none}
footer{text-align:center;padding:25px;color:#64748b;font-size:12px;margin-top:30px}
</style>
</head>
<body>

<header>
  <div class="brand" onclick="showHome()">📘 Lekka Lab</div>
  <nav>
    <button onclick="showHome()">Home</button>
    <button onclick="openSubjectView('Mathematics')">Maths</button>
    <button onclick="openOfficialLinks()">Textbooks</button>
  </nav>
</header>

<main>
  <!-- Home Section -->
  <section id="homeSection">
    <div class="hero">
      <h1 id="heroTitle">Class 6 • SCERT</h1>
      <p>Concept synopses, stand
