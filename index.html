<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lekka Lab: Textbooks Hub</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #f8fafc;
      color: #0f172a;
      padding-bottom: 50px;
    }

    header {
      background: linear-gradient(135deg, #1e3a8a, #0284c7);
      color: white;
      padding: 28px 16px;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.08);
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .container {
      max-width: 620px;
      margin: 0 auto;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 22px 20px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .card-scert {
      border-left: 6px solid #ea580c;
    }

    .card-ncert {
      border-left: 6px solid #0284c7;
    }

    .info h2 {
      font-size: 18px;
      color: #0f172a;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .info p {
      font-size: 13px;
      color: #64748b;
    }

    .btn {
      display: inline-block;
      padding: 10px 22px;
      color: #ffffff;
      text-decoration: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      transition: opacity 0.2s ease;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn-scert {
      background-color: #ea580c;
    }

    .btn-ncert {
      background-color: #0284c7;
    }
  </style>
</head>
<body>

  <header>
    <h1>Lekka Lab: Textbooks Hub</h1>
    <p>Official Textbooks Download Portal</p>
  </header>

  <div class="container">

    <!-- SCERT Card -->
    <div class="card card-scert">
      <div class="info">
        <h2>SCERT Textbooks</h2>
        <p>Official Telangana State Board Textbooks</p>
      </div>
      <a href="https://scert.telangana.gov.in/" target="_blank" rel="noopener noreferrer" class="btn btn-scert">Download ↗</a>
    </div>

    <!-- NCERT Card -->
    <div class="card card-ncert">
      <div class="info">
        <h2>NCERT Textbooks</h2>
        <p>Official Central Board (NCERT) Textbooks</p>
      </div>
      <a href="https://ncert.nic.in/textbook.php" target="_blank" rel="noopener noreferrer" class="btn btn-ncert">Download ↗</a>
    </div>

  </div>

</body>
</html>
