<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VidyaSetu: Maths Learning Hub</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background-color: #f4f6f9; }
    header { background-color: #1a252f; color: white; padding: 25px; text-align: center; }
    header h1 { margin: 0; font-size: 26px; }
    header p { margin: 5px 0 0; font-size: 14px; opacity: 0.8; }
    .nav-bar { display: flex; justify-content: center; gap: 10px; margin: 20px 0; }
    button { padding: 8px 18px; border: 1px solid #007bff; border-radius: 6px; cursor: pointer; background: white; font-weight: 500; }
    button.active { background-color: #007bff; color: white; }
    .container { max-width: 900px; margin: auto; padding: 0 20px 30px; }
    .card { background: white; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.08); }
    h3 { margin-top: 0; color: #2c3e50; border-bottom: 2px solid #eee; padding-bottom: 8px; }
    .formula-list { line-height: 1.8; }
  </style>
</head>
<body>

<header>
  <h1>VidyaSetu: Maths Learning Hub</h1>
  <p>Classes 6 to 10 Mathematics Portal</p>
</header>

<div class="container">
  <div class="nav-bar">
    <button class="class-btn active" onclick="selectClass(6)">Class 6</button>
    <button class="class-btn" onclick="selectClass(7)">Class 7</button>
    <button class="class-btn" onclick="selectClass(8)">Class 8</button>
    <button class="class-btn" onclick="selectClass(9)">Class 9</button>
    <button class="class-btn" onclick="selectClass(10)">Class 10</button>
  </div>

  <div class="card">
    <h3>Official Reference Textbooks</h3>
    <div id="textbook-content">Loading...</div>
  </div>

  <div class="card">
    <h3>Important Formulas & Key Concepts</h3>
    <div id="formula-content" class="formula-list">Loading...</div>
  </div>

  <div class="card">
    <h3>Subject Smart Mini-Quiz</h3>
    <div id="quiz-content">Loading...</div>
  </div>
</div>

<script>
  const portalData = {
    6: {
      books: [
        { name: "NCERT Class 6 Mathematics", link: "https://ncert.nic.in/textbook.php?femh1=0-14", type: "Textbook" },
        { name: "SCERT Class 6 Maths (EM/TM)", link: "https://scert.telangana.gov.in/", type: "Textbook" },
        { name: "Class 6 NCERT Solutions (All Chapters)", link: "https://www.learncbse.in/ncert-solutions-for-class-6-maths/", type: "Solutions" }
      ],
      formulas: [
        "Perimeter of Rectangle = 2 × (Length + Breadth)",
        "Area of Square = Side × Side",
        "HCF × LCM = Product of Two Numbers"
      ],
      quiz: "Q: What is the predecessor of 1000? <br> <b>A: 999</b>"
    },
    7: {
      books: [
        { name: "NCERT Class 7 Mathematics", link: "https://ncert.nic.in/textbook.php?gemh1=0-15", type: "Textbook" },
        { name: "SCERT Class 7 Maths (EM/TM)", link: "https://scert.telangana.gov.in/", type: "Textbook" },
        { name: "Class 7 NCERT Solutions (Step-by-Step)", link: "https://www.learncbse.in/ncert-solutions-for-class-7-maths/", type: "Solutions" }
      ],
      formulas: [
        "Simple Interest (I) = (P × T × R) / 100",
        "Area of Triangle = 1/2 × Base × Height",
        "Speed = Distance / Time"
      ],
      quiz: "Q: What is (-5) × (-4)? <br> <b>A: 20</b>"
    },
    8: {
      books: [
        { name: "NCERT Class 8 Mathematics", link: "https://ncert.nic.in/textbook.php?hemh1=0-16", type: "Textbook" },
        { name: "SCERT Class 8 Maths Textbook", link: "https://scert.telangana.gov.in/", type: "Textbook" },
        { name: "Class 8 NCERT Solutions", link: "https://www.learncbse.in/ncert-solutions-for-class-8-maths/", type: "Solutions" }
      ],
      formulas: [
        "(a + b)² = a² + 2ab + b²",
        "Volume of Cuboid = l × b × h",
        "Compound Interest: A = P(1 + r/100)ⁿ"
      ],
      quiz: "Q: How many diagonals does a quadrilateral have? <br> <b>A: 2</b>"
    },
    9: {
      books: [
        { name: "NCERT Class 9 Mathematics", link: "https://ncert.nic.in/textbook.php?iemh1=0-15", type: "Textbook" },
        { name: "SCERT Class 9 Maths Textbook", link: "https://scert.telangana.gov.in/", type: "Textbook" },
        { name: "Class 9 NCERT Solutions & Theorems", link: "https://www.learncbse.in/ncert-solutions-for-class-9-maths/", type: "Solutions" }
      ],
      formulas: [
        "Heron's Formula: √[s(s-a)(s-b)(s-c)]",
        "Surface Area of Sphere = 4πr²",
        "Volume of Cone = 1/3 πr²h"
      ],
      quiz: "Q: What is the degree of a non-zero constant polynomial? <br> <b>A: 0</b>"
    },
    10: {
      books: [
        { name: "NCERT Class 10 Mathematics", link: "https://ncert.nic.in/textbook.php?jemh1=0-15", type: "Textbook" },
        { name: "SCERT Class 10 Maths (State Board)", link: "https://scert.telangana.gov.in/", type: "Textbook" },
        { name: "Class 10 Board Solutions & Model Papers", link: "https://www.learncbse.in/ncert-solutions-for-class-10-maths/", type: "Solutions" }
      ],
      formulas: [
        "Quadratic Formula: x = [-b ± √(b² - 4ac)] / 2a",
        "Trigonometric Identity: sin²θ + cos²θ = 1",
        "Distance Formula: √[(x₂ - x₁)² + (y₂ - y₁)²]"
      ],
      quiz: "Q: For which value of discriminant does an equation have real & equal roots? <br> <b>A: D = 0</b>"
    }
  };

  function renderClassData(grade) {
    const data = portalData[grade];

    let booksHtml = '<div style="display: flex; flex-direction: column; gap: 10px;">';
    data.books.forEach(b => {
      const badgeColor = b.type === "Solutions" ? "#28a745" : "#007bff";
      booksHtml += `
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #f8f9fa; border-radius: 6px; border-left: 4px solid ${badgeColor};">
          <div>
            <strong>${b.name}</strong> 
            <span style="font-size: 11px; background: ${badgeColor}; color: white; padding: 2px 6px; border-radius: 4px; margin-left: 8px;">${b.type}</span>
          </div>
          <a href="${b.link}" target="_blank" style="padding: 6px 12px; background: #1a252f; color: white; text-decoration: none; border-radius: 4px; font-size: 13px;">View / Download</a>
        </div>`;
    });
    booksHtml += '</div>';
    document.getElementById('textbook-content').innerHTML = booksHtml;

    let formulasHtml = "<ul>";
    data.formulas.forEach(f => { formulasHtml += `<li>${f}</li>`; });
    formulasHtml += "</ul>";
    document.getElementById('formula-content').innerHTML = formulasHtml;

    document.getElementById('quiz-content').innerHTML = `<p>${data.quiz}</p>`;
  }

  function selectClass(grade) {
    const buttons = document.querySelectorAll('.class-btn');
    buttons.forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
    renderClassData(grade);
  }

  window.onload = function() {
    renderClassData(6);
  };
</script>

</body>
</html>
