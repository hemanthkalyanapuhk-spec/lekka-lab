<section id="textbook-library">
  <h2>📚 Complete Textbook Library</h2>
  <p>Access textbooks for Classes 1–12 in English medium where available.</p>

  <label for="textClass">Select Class</label>
  <select id="textClass">
    <option value="1">Class 1</option>
    <option value="2">Class 2</option>
    <option value="3">Class 3</option>
    <option value="4">Class 4</option>
    <option value="5">Class 5</option>
    <option value="6">Class 6</option>
    <option value="7">Class 7</option>
    <option value="8">Class 8</option>
    <option value="9">Class 9</option>
    <option value="10" selected>Class 10</option>
    <option value="11">Class 11</option>
    <option value="12">Class 12</option>
  </select>

  <label for="textBoard">Select Board</label>
  <select id="textBoard">
    <option value="SCERT">Telangana SCERT</option>
    <option value="NCERT">NCERT</option>
  </select>

  <button onclick="openTextbooks()">Find Textbooks →</button>

  <div id="textbookResults" class="grid subjects"
       style="margin-top:20px"></div>
</section>

<script>
function openTextbooks() {
  const cls = document.getElementById("textClass").value;
  const board = document.getElementById("textBoard").value;
  const results = document.getElementById("textbookResults");

  const links = board === "NCERT"
    ? [
        {
          title: "NCERT Chapter-wise PDFs",
          description: "Find textbooks and individual chapter PDFs.",
          url: "https://ncert.nic.in/textbook.php"
        },
        {
          title: "ePathshala",
          description: "Explore digital textbooks and learning materials.",
          url: "https://epathshala.nic.in/"
        },
        {
          title: "DIKSHA",
          description: "Explore digital school learning resources.",
          url: "https://diksha.gov.in/"
        }
      ]
    : [
        {
          title: "Telangana SCERT Textbooks",
          description: "Open the official Telangana e-textbook section.",
          url: "https://scert.telangana.gov.in/EBooks.aspx"
        },
        {
          title: "Telangana SCERT Website",
          description: "Explore official curriculum and education resources.",
          url: "https://scert.telangana.gov.in/"
        },
        {
          title: "DIKSHA",
          description: "Explore available digital learning materials.",
          url: "https://diksha.gov.in/"
        }
      ];

  results.innerHTML = `
    <div class="card" style="grid-column:1/-1">
      <h3>${board} · Class ${cls}</h3>
      <p>Choose an official resource below. Select Class ${cls},
      English medium and your subject on the source website
      wherever these options are available.</p>
    </div>
    ${links.map(item => `
      <div class="card">
        <h3>${item.title}</h3>
        <p>${item.description}</p>
        <a href="${item.url}" target="_blank" rel="noopener">
          Open resource ↗
        </a>
      </div>
    `).join("")}
  `;
}
openTextbooks();
</script>
