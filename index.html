<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lekka Lab: Educational Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    body {
      background-color: #f1f5f9;
      color: #0f172a;
      padding-bottom: 50px;
    }

    header {
      background: linear-gradient(135deg, #091e42, #0284c7);
      color: white;
      padding: 22px 16px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
      margin-bottom: 24px;
    }

    .header-content {
      max-width: 620px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .emblem-wrapper {
      width: 74px;
      height: 74px;
      flex-shrink: 0;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.3));
    }

    .header-text {
      display: flex;
      flex-direction: column;
    }

    header h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.3px;
      margin-bottom: 2px;
      line-height: 1.2;
    }

    header .motto-tag {
      font-size: 13px;
      font-weight: 600;
      color: #bae6fd;
      letter-spacing: 0.2px;
      margin-bottom: 3px;
      font-style: italic;
    }

    header p.subtext {
      font-size: 12px;
      opacity: 0.85;
    }

    .container {
      max-width: 620px;
      margin: 0 auto;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 16px 20px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.04);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .card-scert { border-left: 6px solid #f97316; }
    .card-ncert { border-left: 6px solid #0284c7; }

    .info h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 17px;
      color: #0f172a;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .info p {
      font-size: 13px;
      color: #64748b;
    }

    .btn-download {
      display: inline-block;
      padding: 9px 18px;
      color: #ffffff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .btn-scert { background-color: #f97316; }
    .btn-ncert { background-color: #0284c7; }

    .section-title {
      font-family: 'Outfit', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: #1e293b;
      margin-top: 6px;
      padding-bottom: 6px;
      border-bottom: 2px solid #e2e8f0;
    }

    details.class-box {
      background: white;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.03);
    }

    details.class-box > summary {
      background: #0f172a;
      color: white;
      padding: 15px 18px;
      font-family: 'Outfit', sans-serif;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    details.class-box > summary::-webkit-details-marker {
      display: none;
    }

    details.class-box > summary::after {
      content: "▼";
      font-size: 12px;
      transition: transform 0.2s;
    }

    details.class-box[open] > summary::after {
      transform: rotate(180deg);
    }

    .class-content {
      padding: 14px;
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    details.fa-accordion {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      overflow: hidden;
    }

    details.fa-accordion > summary {
      background: #0284c7;
      color: white;
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    details.fa-accordion > summary::-webkit-details-marker {
      display: none;
    }

    details.fa-accordion > summary::after {
      content: "▼";
      font-size: 11px;
      transition: transform 0.2s;
    }

    details.fa-accordion[open] > summary::after {
      transform: rotate(180deg);
    }

    .file-list {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #f1f5f9;
    }

    .file-btn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
      color: #0f172a;
      text-decoration: none;
      padding: 11px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.15s ease;
    }

    .file-btn:hover {
      background: #e0f2fe;
      border-color: #0284c7;
      color: #0369a1;
    }

    .dl-badge {
      background: #0284c7;
      color: white;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
    }

    .fa-grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .fa-grid-4 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 12px;
    }

    .fa-grid-btn {
      display: block;
      text-align: center;
      background: #f8fafc;
      color: #64748b;
      text-decoration: none;
      padding: 10px 4px;
      border: 1px dashed #cbd5e1;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
    }

    footer {
      text-align: center;
      margin-top: 40px;
      padding-top: 18px;
      border-top: 1px solid #cbd5e1;
      color: #64748b;
      font-size: 13px;
    }

    footer strong {
      color: #0f172a;
    }
  </style>
</head>

      <div class="emblem-wrapper">
