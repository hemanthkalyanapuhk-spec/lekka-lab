<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VidyaSetu - All-in-One School Learning App</title>
  <style>
    :root { --primary: #2563eb; --secondary: #0f172a; --bg: #f8fafc; --card-bg: #ffffff; --accent: #10b981; --warn: #f59e0b; --purple: #8b5cf6; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: var(--bg); color: #334155; line-height: 1.6; }
    header { background: var(--secondary); color: white; padding: 1.5rem; text-align: center; }
    header h1 { font-size: 1.8rem; margin-bottom: 0.3rem; }
    header p { font-size: 0.95rem; opacity: 0.9; }
    .container { max-width: 1000px; margin: 1.5rem auto; padding: 0 1rem; }
    .class-tabs, .subject-tabs { display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; margin-bottom: 1rem; }
    .tab-btn { padding: 0.6rem 1.2rem; border: 2px solid var(--primary); background: white; color: var(--primary); font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    .tab-btn.active, .tab-btn:hover { background: var(--primary); color: white; }
    .sub-btn { padding: 0.5rem 1rem; border: 2px solid var(--purple); background: white; color: var(--purple); font-weight: 600; border-radius: 20px; cursor: pointer; }
    .sub-btn.active, .sub-btn:hover { background: var(--purple); color: white; }
    .card { background: var(--card-bg); padding: 1.5rem; border-radius: 12px; margin-bottom: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .card h2 { color: var(--secondary); margin-bottom: 1rem; font-size: 1.3rem; border-bottom: 2px solid #e2e8f0; padding-bottom: 0.5rem; }
    .btn-link { display: inline-block; background: var(--accent); color: white; text-decoration: none; padding: 0.6rem 1rem; border-radius: 6px; font-size: 0.9rem; font-weight: 600; margin-top: 0.5rem; }
    .content-item { margin-bottom: 1.2rem; padding: 0.8rem; background: #f1f5f9; border-radius: 8px; }
    .content-item h4 { color: var(--primary); margin-bottom: 0.3rem; }
    .step-box { background: white; padding: 0.6rem; border-left: 4px solid var(--primary); margin-top: 0.4rem; font-size: 0.95rem; }
    .quiz-option { display: block; margin: 0.5rem 0; padding: 0.5rem; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; cursor: pointer; text-align: left; width: 100%; }
    .quiz-option:hover { background: #e2e8f0; }
    .formula-list { background: #fffbeb; border-left: 4px solid var(--warn); padding: 1rem; border-radius: 6px; }
  </style>
</head>
<body>
  <header>
    <h1>VidyaSetu: English Medium School Portal</h1>
    <p>Maths, Science & Social Learning Hub for Classes 6-10</p>
  </header>
  
  <div class="container">
    <div class="class-tabs">
      <button class="tab-btn active" id="c6" onclick="changeClass(6)">Class 6</button>
      <button class="tab-btn" id="c7" onclick="changeClass(7)">Class 7</button>
      <button class="tab-btn" id="c8" onclick="changeClass(8)">Class 8</button>
      <button class="tab-btn" id="c9" onclick="changeClass(9)">Class 9</button>
      <button class="tab-btn" id="c10" onclick="changeClass(10)">Class 10</button>
    </div>

    <div class="subject-tabs">
      <button class="sub-btn active" id="s-maths" onclick="changeSubject('maths')">Mathematics</button>
      <button class="sub-btn" id="s-science" onclick="changeSubject('science')">General Science</button>
      <button class="sub-btn" id="s-social" onclick="changeSubject('social')">Social Studies</button>
    </div>

    <div class="card">
      <h2 id="textbook-title">Official Reference Textbooks</h2>
      <div id="textbook-links" style="margin-top: 0.8rem; display: flex; gap: 1rem; flex-wrap: wrap;"></div>
    </div>

    <div class="card">
      <h2 id="summary-title">Important Formulas & Key Concepts</h2>
      <div id="formula-container" class="formula-list"></div>
    </div>

    <div class="card">
      <h2>Subject Smart Mini-Quiz</h2>
      <div id="quiz-container"></div>
      <p id="quiz-feedback" style="margin-top: 0.8rem; font-weight: bold;"></p>
    </div>

    <div class="card">
      <h2 id="solutions-title">Chapter Material & Solutions</h2>
      <div id="solutions-container"></div>
    </div>
  </div>
