<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VidyaSetu: Maths Learning Hub</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background-color: #f4f6f9; color: #333; }
    header { background-color: #1a252f; color: white; padding: 25px 15px; text-align: center; }
    header h1 { margin: 0; font-size: 26px; }
    header p { margin: 5px 0 0; font-size: 14px; opacity: 0.85; }
    
    .nav-bar { display: flex; justify-content: center; gap: 8px; margin: 20px auto; padding: 0 10px; max-width: 950px; flex-wrap: wrap; }
    button.class-btn { padding: 9px 18px; border: 1.5px solid #007bff; border-radius: 6px; cursor: pointer; background: white; font-weight: 600; color: #007bff; transition: 0.2s; font-size: 14px; }
    button.class-btn.active, button.class-btn:hover { background-color: #007bff; color: white; }
    
    .container { max-width: 950px; margin: auto; padding: 0 16px 40px; }
    .card { background: white; border-radius: 8px; padding: 22px; margin-bottom: 22px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
    h3 { margin-top: 0; color: #2c3e50; border-bottom: 2px solid #eee; padding-bottom: 10px; font-size: 18px; }
    
    /* Books Section */
    .book-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; background: #f8f9fa; border-radius: 6px; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
    .badge { font-size: 11px; padding: 3px 8px; border-radius: 4px; color: white; margin-left: 8px; font-weight: normal; }
    .btn-link { padding: 7px 14px; background: #1a252f; color: white; text-decoration: none; border-radius: 4px; font-size: 13px; font-weight: 500; display: inline-block; }
    .btn-link:hover { background: #007bff; }
    
    /* Formulas Section */
    .chapter-box { background: #fafbfc; border: 1px solid #e1e4e8; border-radius: 6px; padding: 14px 16px; margin-bottom: 12px; }
    .chapter-title { font-weight: bold; color: #0056b3; margin-bottom: 8px; font-size: 15px; }
    .chapter-box ul { margin: 0; padding-left: 20px; line-height: 1.8; font-size: 14px; }
    
    /* Quiz Section */
    .quiz-question { font-weight: 600; font-size: 16px; margin-bottom: 12px; }
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    @media (max-width: 500px) { .options-grid { grid-template-columns: 1fr; } }
    .option-btn { padding: 12px; border: 1px solid #ced4da; border-radius: 6px; background: white; cursor: pointer; text-align: left; font-size: 14px; transition: 0.2s; }
    .option-btn:hover { background: #e9ecef; }
    .option-btn.correct { background-color: #d4edda !important; border-color: #28a745 !important; color: #155724; font-weight: bold; }
    .option-btn.wrong { background-color: #f8d7da !important; border-color: #dc3545 !important; color: #721c24; }
    .quiz-feedback { font-size: 14px; font-weight: 600; min-height: 20px; }
  </style>
</head>
<body>

<header>
  <h1>VidyaSetu: Maths Learning Hub</h1>
  <p>Classes 6 to 10 Mathematics Portal (SCERT &amp; NCERT)</p>
</header>

<div class="container">
  <!-- Class Selectors -->
  <div class="nav-bar">
    <button class="class-btn active" onclick="selectClass(6, this)">Class 6</button>
    <button class="class-btn" onclick="selectClass(7, this)">Class 7</button>
    <button class="class-btn" onclick="selectClass(8, this)">Class 8</button>
    <button class="class-btn" onclick="selectClass(9, this)">Class 9</button>
    <button class="class-btn" onclick="selectClass(10, this)">Class 10</button>
  </div>

  <!-- Textbooks & Solutions (Pre-filled for Class 6) -->
  <div class="card">
    <h3>Official Reference Textbooks &amp; Solutions</h3>
    <div id="textbook-content">
      <div class="book-item" style="border-left: 4px solid #007bff;">
        <div><strong>NCERT Class 6 Mathematics Textbook</strong><span class="badge" style="background: #007bff;">NCERT</span></div>
        <a href="https://ncert.nic.in/text
