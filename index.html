<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask Lucky - AI Study Assistant</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center p-4">

    <div class="w-full max-w-2xl mx-auto space-y-6">
        
        <!-- App Header / Input Card -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
            
            <!-- Textarea for User Prompt -->
            <div>
                <label for="promptInput" class="block text-xs font-semibold tracking-wider text-slate-400 uppercase mb-2">Ask Anything</label>
                <textarea id="promptInput" rows="3" placeholder="e.g., Explain bpt theorem..." 
                    class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent resize-none text-sm"></textarea>
            </div>

            <!-- Action Buttons -->
            <div class="flex gap-3">
                <button id="askBtn" onclick="handleAskLucky()" 
                    class="flex-1 bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white font-medium py-3 px-4 rounded-xl transition duration-150 shadow-lg shadow-blue-600/20 text-sm">
                    Ask Lucky
                </button>
                <button onclick="clearAll()" 
                    class="bg-slate-800 hover:bg-slate-700 active:bg-slate-900 text-slate-300 font-medium py-3 px-5 rounded-xl transition duration-150 text-sm">
                    Clear
                </button>
            </div>

            <!-- Quick Search Badges -->
            <div class="pt-2">
                <span class="text-xs text-slate-400 block mb-2 font-medium">Quick Search:</span>
                <div class="flex flex-wrap gap-2">
                    <button onclick="setQuickSearch('Explain bpt theorem')" class="text-xs bg-slate-800 hover:bg-slate-700 border border-slate-700/60 py-1.5 px-3 rounded-full text-slate-300 transition">📐 BPT Theorem</button>
                    <button onclick="setQuickSearch('Explain differentiation intuitively')" class="text-xs bg-slate-800 hover:bg-slate-700 border border-slate-700/60 py-1.5 px-3 rounded-full text-slate-300 transition">📈 Differentiation</button>
                    <button onclick="setQuickSearch('Explain human heart structure and function')" class="text-xs bg-slate-800 hover:bg-slate-700 border border-slate-700/60 py-1.5 px-3 rounded-full text-slate-300 transition">❤️ Human Heart</button>
                    <button onclick="setQuickSearch('రవ్వ లడ్డు తయారీ విధానం')" class="text-xs bg-slate-800 hover:bg-slate-700 border border-slate-700/60 py-1.5 px-3 rounded-full text-slate-300 transition">🍬 Ravva Laddu (Telugu)</button>
                </div>
            </div>

        </div>

        <!-- Output / Response Card -->
        <div id="outputCard" class="hidden bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-3">
            <div class="flex items-center gap-2 text-blue-400 text-xs font-semibold uppercase tracking-wider">
                <span id="outputStatusIcon">🤖</span> 
                <span id="outputStatusText">Ask Lucky is thinking...</span>
            </div>
            <div id="outputContent" class="text-slate-300 text-sm leading-relaxed whitespace-pre-wrap border-t border-slate-800/80 pt-3">
                <!-- Response or Loader Content goes here -->
            </div>
        </div>

        <!-- Official Textbook Portals Section -->
        <div class="space-y-3 pt-4">
            <h2 class="text-sm font-bold tracking-wider text-slate-400 uppercase flex items-center gap-2">
                📚 OFFICIAL TEXTBOOK PORTALS
            </h2>
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex items-center justify-between shadow-lg">
                <div class="space-y-1">
                    <h3 class="font-semibold text-slate-200 text-sm">NCERT Textbooks Portal</h3>
                    <p class="text-xs text-slate-400">Access official digital textbooks from Class 1 to Class 12 across all subjects.</p>
                </div>
                <a href="https://ncert.nic.in" target="_blank" rel="noopener noreferrer" 
                   class="text-xs bg-slate-800 hover:bg-slate-700 text-blue-400 hover:text-blue-300 font-medium py-2 px-3 rounded-xl transition whitespace-nowrap">
                    Visit Portal →
                </a>
            </div>
        </div>

    </div>

    <!-- JavaScript Logic -->
    <script>
        function setQuickSearch(text) {
            document.getElementById('promptInput').value = text;
            handleAskLucky();
        }

        function clearAll() {
            document.getElementById('promptInput').value = '';
            document.getElementById('outputCard').classList.add('hidden');
        }

        async function handleAskLucky() {
            const promptInput = document.getElementById('promptInput');
            const outputCard = document.getElementById('outputCard');
            const outputStatusText = document.getElementById('outputStatusText');
            const outputContent = document.getElementById('outputContent');
            const askBtn = document.getElementById('askBtn');

            const query = promptInput.value.trim();
            if (!query) return;

            // 1. Show Loading State & Clear previous errors/hangs
            outputCard.classList.remove('hidden');
            outputStatusText.textContent = `generating complete answer for: "${query}"`;
            outputContent.innerHTML = `
                <div class="flex items-center justify-center space-x-2 py-6 text-slate-400">
                    <div class="w-4 h-4 border-2 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
                    <span class="text-xs">Thinking... Please wait</span>
                </div>`;
            askBtn.disabled = true;
            askBtn.classList.add('opacity-50', 'cursor-not-allowed');

            try {
                // Simulating network response delay (Replace this block with real fetch() to your backend API if needed)
                await new Promise((resolve) => setTimeout(resolve, 1500));

                // Simulated Successful Response Generation
                outputStatusText.textContent = "Answer Generated Successfully";
                outputContent.innerHTML = getSimulatedAnswer(query);

            } catch (error) {
                // 2. Robust Error Handler preventing infinite loading
                console.error("Ask Lucky Error:", error);
                outputStatusText.textContent = "Request Failed";
                outputContent.innerHTML = `<span class="text-red-400">⚠️ Sorry, something went wrong or the request timed out. Please check your connection and try again.</span>`;
            } finally {
                // 3. Always guarantees button resets state
                askBtn.disabled = false;
                askBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        // Mock generator for common queries
        function getSimulatedAnswer(query) {
            const q = query.toLowerCase();
            if (q.includes('bpt') || q.includes('theorem')) {
                return `**Basic Proportionality Theorem (Thales Theorem):**\n\nIf a line is drawn parallel to one side of a triangle intersecting the other two sides in distinct points, then the other two sides are divided in the same ratio.\n\n* **Formula:** If DE || BC in triangle ABC, then AD/DB = AE/EC.`;
            } else if (q.includes('differentiation')) {
                return `**Differentiation (Intuitive Overview):**\n\nDifferentiation measures how a function changes as its input changes—essentially finding the exact rate of change or the slope of a curve at a single point (instantaneous rate of change).`;
            } else if (q.includes('heart') || q.includes('human')) {
                return `**Human Heart Structure:**\n\nThe human heart is a muscular organ roughly the size of a fist, divided into 4 chambers: two upper chambers (atria) and two lower chambers (ventricles). It pumps oxygenated blood to the body and deoxygenated blood to the lungs.`;
            } else if (q.includes('రవ్వ లడ్డు') || q.includes('laddu')) {
                return `**రవ్వ లడ్డు తయారీ విధానం:**\n\n1. బాణలిలో నెయ్యి వేసి జీడిపప్పు, కిస్మిస్ వేయించి పక్కన పెట్టుకోవాలి.\n2. అదే నెయ్యిలో బొంబాయి రవ్వ (సూజి) వేసి మంచి సువాసన వచ్చే వరకు వేయించాలి.\n3. తగినంత పంచదార పొడి, యాలకల పొడి కలపాలి.\n4. కొద్దిగా వేడి పాలు లేదా నెయ్యి చిలకరిస్తూ ఉండలుగా చుట్టుకోవాలి.`;
            }
            return `Here is the generated information regarding "${query}". You can easily wire this function up to connect with your live LLM endpoint if you migrate your backend code.`;
        }
    </script>
</body>
</html>
