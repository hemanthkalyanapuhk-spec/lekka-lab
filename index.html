<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEKKA LAB - Educational Portal</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --navy-dark: #0a192f;
      --navy-card: #0f172a;
      --gold: #f59e0b;
      --gold-dark: #d97706;
      --blue-accent: #0284c7;
      --orange-accent: #ea580c;
      --border-color: #e2e8f0;
      --text-dark: #0f172a;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-dark);
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Original Blue Badge Header */
    .header-card {
      background: #0f1f38;
      color: #ffffff;
      border-radius: 20px;
      padding: 24px 20px;
      display: flex;
      align-items: center;
      gap: 18px;
      box-shadow: 0 4px 14px rgba(10, 25, 47, 0.2);
    }

    /* Circular Lab Flask Emblem */
    .logo-badge {
      width: 72px;
      height: 72px;
      background: #0b192c;
      border: 3px solid #38bdf8;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.4);
    }

    .logo-badge svg {
      width: 40px;
      height: 40px;
    }

    .header-text h1 {
      font-size: 1.45rem;
      font-weight: 900;
      color: var(--gold);
      letter-spacing: 0.5px;
      line-height: 1.2;
    }

    .header-text h2 {
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-top: 2px;
      color: #ffffff;
    }

    .header-text p.quote {
      font-size: 0.8rem;
      font-style: italic;
      color: #93c5fd;
      margin-top: 4px;
    }

    .header-text p.sub {
      font-size: 0.72rem;
      font-weight: 800;
      color: #cbd5e1;
      text-transform: uppercase;
      margin-top: 5px;
      letter-spacing: 0.5px;
    }

    /* Textbook Rows */
    .card-row {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
      border-left: 5px solid;
    }

    .card-scert { border-left-color: var(--orange-accent); }
    .card-ncert { border-left-color: var(--blue-accent); }

    .card-info h3 {
      font-size: 1.05rem;
      font-weight: 800;
      color: #0f172a;
    }

    .card-info p {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .btn-portal-orange {
      background: var(--orange-accent);
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.85rem;
    }

    .btn-portal-blue {
      background: var(--blue-accent);
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.85rem;
    }

    /* AI Tutor Card */
    .ai-box {
      background: var(--card-bg);
      border: 1.5px solid #fed7aa;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 4px 12px rgba(234, 88, 12, 0.05);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .ai-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .ai-title {
      font-size: 1.05rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
    }
